name: Build INYTEL Messenger

on:
  push:
    branches:
      - main
      - feature/github-actions-builds
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-linux:
    name: Linux · Qt 6
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            ninja-build \
            libssl-dev \
            libgl1-mesa-dev \
            libxkbcommon-x11-0 \
            libxcb-cursor0

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          modules: 'qtmultimedia'
          cache: true

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Prepare artifact
        run: |
          mkdir -p artifact
          find build -type f -name 'lan-messenger' -exec cp {} artifact/ \;
          test -f artifact/lan-messenger

      - name: Upload Linux build
        uses: actions/upload-artifact@v4
        with:
          name: inytel-messenger-linux
          path: artifact/lan-messenger
          if-no-files-found: error
